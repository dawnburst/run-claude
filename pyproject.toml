[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lmi"
version = "0.1.0"
description = "Helper CLI for the Claude Code CLI"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lmi = "lmi.cli:main"

[tool.setuptools.packages.find]
include = ["lmi*"]
